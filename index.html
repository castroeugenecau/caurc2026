<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAURC 2026 | Robotics Tournament</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#05080f] text-white min-h-screen w-full flex flex-col font-sans">

    <header class="w-full bg-[#0a0f18] border-b-4 border-[#d4af37] p-4 flex flex-col md:flex-row items-center justify-between gap-4 shrink-0 shadow-2xl z-50">
        <div class="flex items-center gap-4 justify-center md:justify-start w-full md:w-1/4">
            <img src="logo.png" alt="CAU" class="h-10 w-10 md:h-14 md:w-14 object-contain bg-white rounded-full p-1 border-2 md:border-4 border-[#d4af37]">
            <h1 class="text-xl md:text-2xl font-black uppercase tracking-tighter">CAURC <span class="text-[#d4af37]">2026</span></h1>
        </div>

        <nav id="main-nav" class="w-full md:flex-1 overflow-x-auto no-scrollbar py-2">
            <div class="flex flex-nowrap justify-start md:justify-center items-center gap-3 md:gap-6 min-w-max px-4">
                <div class="flex bg-white/5 rounded-2xl p-1 border border-white/10 gap-1">
                    <div class="nav-item active text-xs md:text-base" data-cat="Line Following" data-lvl="1">Line Following: L1</div>
                    <div class="nav-item text-xs md:text-base" data-cat="Line Following" data-lvl="2">Line Following: L2</div>
                    <div class="nav-item text-xs md:text-base" data-cat="Line Following" data-lvl="3">Line Following: L3</div>
                </div>
                <div class="flex bg-white/5 rounded-2xl p-1 border border-white/10 gap-1">
                    <div class="nav-item text-xs md:text-base" data-cat="Mini Sumo" data-lvl="1">Sumo: L1</div>
                    <div class="nav-item text-xs md:text-base" data-cat="Mini Sumo" data-lvl="2">Sumo: L2/3</div>
                </div>
            </div>
        </nav>

        <div class="hidden md:block text-right w-1/4">
            <div id="sync-time" class="text-[10px] font-mono text-gray-500 uppercase">Syncing...</div>
            <div class="text-[#d4af37] font-black text-sm lg:text-lg">● LIVE BROADCAST</div>
        </div>
    </header>

    <main class="flex-1 p-4 md:p-6 flex flex-col gap-6 bg-cau-blueprint">
        <div id="podium" class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 shrink-0"></div>
        
        <div id="dashboard-body" class="flex-1 w-full overflow-x-auto"></div>
    </main>

    <div id="category-balloon" class="hidden md:block" style="display: none; position: fixed;"></div>
    <script src="script.js"></script>
</body>
</html>
